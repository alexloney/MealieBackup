name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release Notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Mealie Backup ${{ github.ref_name }}
          
          ### 🐳 Docker Image
          
          **Platform:** `linux/amd64` (x86_64)
          
          Pull the Docker image:
          ```bash
          docker pull ghcr.io/${{ github.repository_owner }}/mealiebackup:${{ github.ref_name }}
          docker pull ghcr.io/${{ github.repository_owner }}/mealiebackup:latest
          ```
          
          ### 📦 Installation
          
          **With Docker:**
          ```bash
          # Using version tag
          docker pull ghcr.io/${{ github.repository_owner }}/mealiebackup:${{ github.ref_name }}
          
          # Or using latest
          docker pull ghcr.io/${{ github.repository_owner }}/mealiebackup:latest
          
          # Run with docker-compose
          docker-compose up -d
          ```
          
          **Manual installation:**
          ```bash
          pip install -r requirements.txt
          cp .env.example .env
          # Edit .env with your credentials
          python main.py
          ```
          
          ### 📖 Documentation
          
          - [Docker Deployment Guide](README_DOCKER.md)
          - [GitHub Actions Guide](README_GITHUB_ACTIONS.md)
          - [Main README](README.md)
          
          ### ✨ What's Changed
          
          See commits for details.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
